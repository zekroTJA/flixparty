name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  release:
    name: Build for ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The GUI (freya/Skia) is only built for targets with prebuilt Skia
          # binaries. All other targets only get the CLI.
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os_name: Linux-x86_64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            gui: true
          - os_name: Linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os_name: Linux-arm
            os: ubuntu-latest
            target: arm-unknown-linux-musleabi
          - os_name: Linux-riscv64
            os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
          - os_name: Windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: ".exe"
            gui: true
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            gui: true
          - os_name: macOS-x86_64
            os: macOS-latest
            target: x86_64-apple-darwin
            gui: true
          - os_name: macOS-aarch64
            os: macOS-latest
            target: aarch64-apple-darwin
            gui: true

    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@v2
      - name: Install X11 dependencies on Ubuntu
        run: |
          sudo apt-get update --yes
          sudo apt-get upgrade --yes
          sudo apt-get install --yes libx11-dev libxdo-dev libxcb1-dev libxcb-util-dev libxkbcommon-dev libxi-dev libxtst-dev libxext-dev xdotool
        if: contains(matrix.os, 'ubuntu')
      - name: Install GUI dependencies on Ubuntu
        run: sudo apt-get install --yes libfontconfig1-dev libfreetype-dev libgl-dev libwayland-dev
        if: contains(matrix.os, 'ubuntu') && matrix.gui
      - name: Install musl-tools on Linux
        run: sudo apt-get install --yes musl-tools
        if: contains(matrix.target, 'musl')
      - name: Build CLI
        uses: houseabsolute/actions-rust-cross@v0
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        with:
          command: "build"
          target: ${{ matrix.target }}
          toolchain: stable
          args: "--locked --release -p flixparty-cli"
          strip: true
      - name: Build GUI
        uses: houseabsolute/actions-rust-cross@v0
        if: matrix.gui
        with:
          command: "build"
          target: ${{ matrix.target }}
          toolchain: stable
          args: "--locked --release -p flixparty-gui"
          strip: true
      - name: Rename Artifacts
        shell: bash
        run: |
          ver=${GITHUB_REF#refs/tags/}
          CLI_PATH=flixparty-cli-$ver-${{ matrix.target }}${{ matrix.ext }}
          mv target/${{ matrix.target }}/release/flixparty-cli${{ matrix.ext }} $CLI_PATH
          echo "$CLI_PATH" > assets.txt
          if [ "${{ matrix.gui }}" = "true" ]; then
            GUI_PATH=flixparty-$ver-${{ matrix.target }}${{ matrix.ext }}
            mv target/${{ matrix.target }}/release/flixparty${{ matrix.ext }} $GUI_PATH
            echo "$GUI_PATH" >> assets.txt
          fi
          {
            echo "ASSET_PATHS<<EOF"
            cat assets.txt
            echo "EOF"
          } >> $GITHUB_ENV
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ env.ASSET_PATHS }}
