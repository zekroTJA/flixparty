[package]
name = "flixparty"
version = "0.5.2"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
figment = { version = "0.10.19", features = ["toml"] }
rdev = { version = "0.5.3", features = ["serde", "serialize"] }
redis = "0.27.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
xid = "1.1.1"
yansi = "1.0.1"
